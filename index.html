<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App del clima</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="caja">
    <header class="header-box">
      <div class="logo-box">
        <img src="logo.png" alt="Logo B10">
      </div>
      <h1>Clima N.º 0392</h1>
    </header>

    <form id="form">
      <input type="text" id="ciudad" placeholder="Escribe una ciudad" required>
      <button type="submit" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
    </form>

    <p id="mensaje"></p>

    <section id="resultado" hidden>
      <h2 id="nombre"></h2>
      <p class="temp" id="temp"></p>
      <p id="descripcion"></p>
      <div class="datos">
        <p><i class="fa-solid fa-droplet"></i> Humedad: <strong id="humedad"></strong></p>
        <p><i class="fa-solid fa-wind"></i> Viento: <strong id="viento"></strong></p>
      </div>
    </section>

    <footer class="footer-info">
      <p class="author"><strong>Creador:</strong> Rodrigo Santini</p>
      <p class="career">Estudiante de Ingeniería de Software</p>
      <p class="social">
        <strong>Instagram:</strong> 
        <a href="https://instagram.com/ronits.ss" target="_blank" rel="noopener noreferrer">@ronits.ss</a>
      </p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
